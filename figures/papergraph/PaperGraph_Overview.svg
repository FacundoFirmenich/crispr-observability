<path d="M1513.75,455L1513.75,485" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M1317.5,607.5L1287.5,607.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M895.0,607.5L865.0,607.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M472.5,607.5L442.5,607.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M246.25,730L246.25,760" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M442.5,882.5L472.5,882.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
<path d="M865.0,882.5L895.0,882.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
