<svg id="papergraph-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1320" role="img" aria-labelledby="pg-title pg-desc">
<title id="pg-title">CRISPR PaperGraph: the argument, evidence and limits</title>
<desc id="pg-desc">Twelve numbered stations give the reading order of the article. Dotted connectors indicate reading order only. The linked model and interactive version retain typed scientific relations, source identities, assumptions and revision conditions. The diagram does not identify molecular accuracy or biological function.</desc>
<rect width="1760" height="1320" fill="#fbfcfa"/>
<rect x="0" y="0" width="1760" height="9" fill="#006d72"/>
<text font-family="DejaVu Sans" font-size="17" fill="#006d72" font-weight="700"><tspan x="50" y="53.0">PAPERGRAPH / CRISPR OBSERVABILITY</tspan></text>
<text font-family="DejaVu Sans" font-size="36" fill="#1b3440" font-weight="700"><tspan x="50" y="105.0">Follow what is observed. Keep every inference conditional.</tspan></text>
<text font-family="DejaVu Sans" font-size="19" fill="#1b3440"><tspan x="50" y="148.0">Question → contract → evidence → conditional conclusion → frontier.</tspan></text>
<text font-family="DejaVu Sans" font-size="18" fill="#526873"><tspan x="50" y="184.0">Read stations 01–12. Dotted arrows mean “read next”, not “proves”.</tspan></text>
<defs><marker id="reading-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#9dacb1" stroke-width="1.5"/></marker></defs>
<path d="M442.5,332.5L472.5,332.5" fill="none" stroke="#9dacb1" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#reading-arrow)"/>
