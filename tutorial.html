<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CFTR guided tutorial</title><style>body{font:19px/1.7 system-ui;max-width:950px;margin:40px auto;padding:24px;background:#f8f7fc;color:#293953}button,a{color:#395cb1}button{font:inherit;border:1px solid #b8bade;background:#eef0ff;border-radius:12px;padding:10px;margin:5px}article{background:#eeeafa;padding:30px;border-radius:20px}progress{width:100%;accent-color:#7753ac}h1,h2{color:#6545a0}</style><h1>CFTR · From reads to a decision</h1><p>15–20 min learning target · No measured usability claim / Duración prevista, no validada</p><button id="lang">Castellano / English</button><progress id="progress" max="7"></progress><article><p id="position"></p><h2 id="title"></h2><p id="explain"></p><details><summary>Checkpoint / Comprobación</summary><p id="question"></p></details></article><button id="back">←</button><button id="next">→</button><p><a href="report.html">Count-based CFTR report</a> · <a href="lab.html">3D laboratory</a></p><script>const steps=[["Define the question", "Defina la pregunta", "Does this declared exact DNA event have a positive treated–mock contrast among acquired records? Editing efficiency, exact DNA and channel function are distinct targets.", "¿El evento de ADN exacto tiene un contraste positivo entre tratado y mock? Eficiencia de edición, ADN exacto y función del canal son objetivos distintos."], ["Inspect the authentic inputs", "Examine las entradas reales", "The FASTQ example uses SRR29623272 and SRR29623273. Its configuration declares exact anchors and whole-read mean Q30. Change a contract only as a separately labelled analysis.", "El ejemplo usa SRR29623272 y SRR29623273, anclas exactas y calidad media Q30. Un cambio de contrato constituye otro análisis identificado."], ["Account for every record", "Conserve todos los registros", "E, NE and U partition the original input. Failed quality and missing or multiple anchor pairs remain U. A read ID identifies an acquired record, not an original molecule.", "E, NE y U particionan la entrada. Calidad insuficiente y anclas ausentes o múltiples permanecen U. Un identificador de lectura no identifica por sí solo una molécula original."], ["Read the exact decision", "Interprete la decisión", "The exact-DNA FASTQ contrast is 13.11530–22.69773 percentage points. A positive lower bound survives every binary completion of U under accepted-label correctness. It is not a confidence interval.", "El contraste de ADN exacto es 13,11530–22,69773 pp. La cota inferior positiva resiste todas las completaciones binarias de U bajo corrección de las etiquetas aceptadas. No es un intervalo de confianza."], ["Compare like with like", "Compare objetivos equivalentes", "For SRR29623272, 4485/20176 reads are assigned Prime-edited by the archived caller (22.22938%). This assignment is different from an exact-DNA or native-local event. Both the denominator and target must be named.", "En SRR29623272, el programa asigna 4485/20176 lecturas a Prime-edited (22,22938%). Esa asignación es distinta del ADN exacto y del evento local. Hay que identificar denominador y objetivo."], ["Probe the boundary", "Explore el límite", "In the 3D lab, compare a 224-base read with an assumed 225-base acquisition. Containment changes, but no observed base is created. A new measurement is required to test the added position.", "En el laboratorio, compare una lectura de 224 bases con una adquisición hipotética de 225. Cambia la contención, pero no se crea una base observada. Hace falta una nueva medición."], ["Export and choose the next test", "Exporte y elija el próximo contraste", "Export input.json, report.json and report.html. To link channel function, authenticate culture, library, assay and time. To estimate editing accuracy, obtain independent labels linked to the correct unit.", "Exporte input.json, report.json y report.html. Para vincular función autentique cultivo, biblioteca, ensayo y tiempo. Para estimar exactitud obtenga etiquetas independientes enlazadas a la unidad correcta."]];let i=0,es=false;function draw(){document.documentElement.lang=es?'es':'en';document.getElementById('progress').value=i+1;document.getElementById('position').textContent=(i+1)+' / '+steps.length;document.getElementById('title').textContent=steps[i][es?1:0];document.getElementById('explain').textContent=steps[i][es?3:2];document.getElementById('question').textContent=es?'Antes de avanzar: identifique el objetivo, la unidad de evidencia y qué no permite concluir este paso.':'Before moving on: name the target, the evidence unit and what this step cannot establish.';document.getElementById('back').disabled=i===0;document.getElementById('next').disabled=i===steps.length-1;}document.getElementById('back').onclick=()=>{if(i>0)i--;draw()};document.getElementById('next').onclick=()=>{if(i<steps.length-1)i++;draw()};document.getElementById('lang').onclick=()=>{es=!es;draw()};draw();</script></html>
