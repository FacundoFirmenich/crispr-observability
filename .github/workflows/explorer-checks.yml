name: Explorer browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare isolated test runtime
        shell: bash
        run: |
          node --version
          node -e 'if (+process.versions.node.split(".")[0] < 20) process.exit(1)'
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/explorer-runtime" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.64.1
      - name: Test rendered offline companion
        shell: bash
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/explorer-runtime/node_modules/playwright-core
          EXPLORER_QA_OUTPUT: ${{ runner.temp }}/explorer-qa
        run: node code/check_explorer_browser.cjs
      - name: Retain temporary visual QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: explorer-browser-qa
          path: ${{ runner.temp }}/explorer-qa/
          retention-days: 1
          if-no-files-found: warn
