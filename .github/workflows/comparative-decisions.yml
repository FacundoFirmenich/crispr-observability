name: Comparative decision evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exact-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python extensions/comparative_execution/check_results.py
