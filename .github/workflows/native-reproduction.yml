name: Native scientific reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - 'reproducibility/**'
      - '.github/workflows/native-reproduction.yml'
      - '.gitattributes'
      - 'extensions/retained_span_audit/**'
      - 'extensions/generation_model/validation/**'
permissions:
  contents: read
jobs:
  replay:
    name: Replay on ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
            python: '3.14.0'
            requirements: requirements-native.txt
          - target: linux-x86_64
            runner: ubuntu-22.04
            python: '3.14.0'
            requirements: requirements-native.txt
          - target: macos-arm64
            runner: macos-15
            python: '3.14.0'
            requirements: requirements-native.txt
          - target: macos-x86_64
            runner: macos-15-intel
            python: '3.13.12'
            requirements: requirements-macos-intel.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact build dependencies
        run: >-
          python -m pip install --only-binary=:all: -r reproducibility/${{ matrix.requirements }}
      - name: Check public distribution
        run: python code/check_public_distribution.py
      - name: Build, extract and run native full replay
        run: python reproducibility/build_native.py --source-commit ${{ github.sha }} --output native-build --test-mode full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crispr-reproduce-${{ matrix.target }}
          path: native-build/
          if-no-files-found: error
