name: generation-model-validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/generation_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python tests/verify_oracle.py
      - run: python tests/verify_regressions.py
      - run: python tests/verify_obstruction.py
      - run: python tests/verify_calibration.py
