name: Read Observability Lab v0.5 junction evidence and multi-input validation
on:
  push:
    branches:
      - lab-junction-evidence-v05
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engine dependencies on the runner
        working-directory: engine
        run: npm ci --no-fund --no-audit
      - name: Verify frozen public inputs and run the project
        run: |
          mkdir -p "$RUNNER_TEMP/rol-v04"
          unzip -q validation/rol-v03-inputs.zip -d "$RUNNER_TEMP/rol-v04"
          (cd "$RUNNER_TEMP/rol-v04" && sha256sum --check INPUTS.sha256)
          node engine/project-test.mjs "$RUNNER_TEMP/rol-v04"
          node engine/project-cli.mjs schema > "$RUNNER_TEMP/rol-v04/observability-project.schema.json"
      - name: Exercise exact junction and mate semantics in SAM and indexed BAM
        run: |
          command -v samtools >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y samtools)
          cp engine/testdata/junction-fixture.sam "$RUNNER_TEMP/rol-v04/"
          samtools view -b -o "$RUNNER_TEMP/rol-v04/junction-fixture.bam" "$RUNNER_TEMP/rol-v04/junction-fixture.sam"
          samtools index "$RUNNER_TEMP/rol-v04/junction-fixture.bam"
          node engine/project-junction-test.mjs "$RUNNER_TEMP/rol-v04"
      - name: Preserve the remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rol-v05-junction-evidence
          path: |
            ${{ runner.temp }}/rol-v04/PROJECT_V0?_*.json
            ${{ runner.temp }}/rol-v04/project.example.json
            ${{ runner.temp }}/rol-v04/observability-project.schema.json
            ${{ runner.temp }}/rol-v04/hg.fa
            ${{ runner.temp }}/rol-v04/chm.fa
          if-no-files-found: warn
          retention-days: 30
