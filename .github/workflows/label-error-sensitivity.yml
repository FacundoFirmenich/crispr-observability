name: CRISPR P1 conditional label-error sensitivity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Recompute conditional sensitivity and exact logical sharpness checks
        run: python -B extensions/label_error_sensitivity/analyze.py --output "$RUNNER_TEMP/label-sensitivity"
      - name: Compare actual output with frozen I2 values
        run: diff -r extensions/label_error_sensitivity/expected "$RUNNER_TEMP/label-sensitivity"
